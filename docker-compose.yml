version: '3.8'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/audio_timestamping.db
      - UPLOAD_DIR=/app/uploads
      - EXPORT_DIR=/app/exports
  web:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app/frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
